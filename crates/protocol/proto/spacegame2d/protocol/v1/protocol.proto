syntax = "proto3";
package spacegame2d.protocol.v1;

message Envelope {
  oneof payload {
    ClientHello client_hello = 1;
    ServerHello server_hello = 2;
    CommandRequest command_request = 3;
    AuthoritativeCommand authoritative_command = 4;
    CommandRejected command_rejected = 5;
    StateChecksum state_checksum = 6;
    HandshakeRejected handshake_rejected = 7;
  }
}

message ClientHello {
  uint32 simulation_version = 1;
  repeated Capability supported_capabilities = 2;
}
message ServerHello {
  uint32 simulation_version = 1;
  uint32 simulation_hz = 2;
  uint32 player_slot = 3;
  uint64 server_tick = 4;
  repeated Capability enabled_capabilities = 5;
  uint32 fleet_size = 6;
  uint32 world_radius_bits = 7;
}
message CommandRequest {
  uint32 sequence = 1;
  Command command = 2;
}
message AuthoritativeCommand {
  uint64 execute_tick = 1;
  uint32 player_slot = 2;
  uint32 sequence = 3;
  Command command = 4;
}
message Command {
  oneof payload {
    SetDestinationCommand set_destination = 1;
    ResetSimulationCommand reset_simulation = 2;
  }
}
message SetDestinationCommand {
  reserved 1;
  Vector2Bits destination = 2;
}
message ResetSimulationCommand {}
message Vector2Bits {
  fixed32 x = 1;
  fixed32 y = 2;
}
message StateChecksum {
  uint64 tick = 1;
  bytes hash = 2;
}
message CommandRejected {
  uint32 sequence = 1;
  CommandRejectionReason reason = 2;
}
message HandshakeRejected {
  HandshakeRejectionReason reason = 1;
}
enum HandshakeRejectionReason {
  HANDSHAKE_REJECTION_REASON_UNSPECIFIED = 0;
  HANDSHAKE_REJECTION_REASON_SERVER_FULL = 1;
  HANDSHAKE_REJECTION_REASON_INCOMPATIBLE_VERSION = 2;
  HANDSHAKE_REJECTION_REASON_MISSING_REQUIRED_CAPABILITY = 3;
  HANDSHAKE_REJECTION_REASON_INVALID_HANDSHAKE = 4;
}
enum CommandRejectionReason {
  COMMAND_REJECTION_REASON_UNSPECIFIED = 0;
  COMMAND_REJECTION_REASON_INVALID_PLAYER = 1;
  COMMAND_REJECTION_REASON_UNAUTHORIZED_FLEET = 2;
  COMMAND_REJECTION_REASON_NON_FINITE_DESTINATION = 3;
  COMMAND_REJECTION_REASON_DESTINATION_OUTSIDE_ARENA = 4;
  COMMAND_REJECTION_REASON_INVALID_COMMAND = 5;
}
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_STATE_CHECKSUMS = 1;
}
