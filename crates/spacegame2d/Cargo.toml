[package]
name = "spacegame2d"
version = "0.1.0"
edition = "2024"

[dependencies]
spacegame2d-simulation = { path = "../simulation" }
spacegame2d-protocol = { path = "../protocol" }
spacegame2d-logging = { path = "../logging" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
env_logger = "=0.11.11"
glam = "=0.33.2"
log = "=0.4.33"
pollster = "=1.0.1"
wgpu = "=30.0.0"
winit = "=0.30.13"
tracing = "=0.1.40"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
wry = { version = "=0.55.1", features = ["tracing", "transparent"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
gdkx11 = "=0.18.2"
