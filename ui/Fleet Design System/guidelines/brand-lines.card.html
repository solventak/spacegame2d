<!-- @dsCard group="Brand" viewport="700x170" name="Radii, Hairlines & Depth" subtitle="Near-square, hairline-outlined, no drop shadows" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;background:var(--void-1);font:var(--type-body)}.g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}.col{display:grid;gap:6px}</style></head><body><div class="g" style="gap:14px">
<div class="col" style="gap:5px"><i style="display:block;width:78px;height:44px;border:1px solid var(--line-hairline-strong);border-radius:var(--r-0);background:var(--graphite-2)"></i><em class="lb" style="font-style:normal">0px</em></div><div class="col" style="gap:5px"><i style="display:block;width:78px;height:44px;border:1px solid var(--line-hairline-strong);border-radius:var(--r-1);background:var(--graphite-2)"></i><em class="lb" style="font-style:normal">1px · panels</em></div><div class="col" style="gap:5px"><i style="display:block;width:78px;height:44px;border:1px solid var(--line-hairline-strong);border-radius:var(--r-2);background:var(--graphite-2)"></i><em class="lb" style="font-style:normal">2px · chips</em></div><div class="col" style="gap:5px"><i style="display:block;width:78px;height:44px;border:1px solid var(--line-hairline-strong);border-radius:var(--r-full);background:var(--graphite-2)"></i><em class="lb" style="font-style:normal">999px · bars</em></div>
<div class="col" style="gap:5px"><i style="display:block;width:120px;height:44px;background:var(--surface-panel);border:1px solid var(--line-hairline);backdrop-filter:var(--blur-panel);box-shadow:var(--shadow-panel)"></i><em class="lb" style="font-style:normal">panel · 82% + blur(10)</em></div>
<div class="col" style="gap:5px"><i style="display:block;width:120px;height:44px;border:1px dashed var(--sig-neutral-edge)"></i><em class="lb" style="font-style:normal">dashed · unconfirmed</em></div></div></body></html>
