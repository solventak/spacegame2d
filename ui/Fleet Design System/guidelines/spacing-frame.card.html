<!-- @dsCard group="Spacing" viewport="700x190" name="HUD Frame" subtitle="Chrome occupies the outer edges only" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;background:var(--void-1);font:var(--type-body)}.g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}.col{display:grid;gap:6px}</style></head><body><div style="position:relative;height:150px;border:1px solid var(--line-hairline);background:var(--void-1);padding:var(--hud-edge)">
<div style="position:absolute;left:0;right:0;top:0;height:var(--hud-topbar-h);border-bottom:1px solid var(--line-hairline);background:var(--surface-panel)"></div>
<div style="position:absolute;left:var(--hud-edge);bottom:var(--hud-edge);width:150px;height:60px;border:1px solid var(--line-hairline);background:var(--surface-panel)"></div>
<div style="position:absolute;right:var(--hud-edge);bottom:var(--hud-edge);width:150px;height:60px;border:1px solid var(--line-hairline);background:var(--surface-panel)"></div>
<div style="position:absolute;left:50%;transform:translateX(-50%);bottom:var(--hud-edge);width:230px;height:30px;border:1px dashed var(--sig-neutral-edge)"></div>
<div style="position:absolute;inset:56px 180px 90px;display:grid;place-content:center" class="lb">playfield stays clear</div></div></body></html>
