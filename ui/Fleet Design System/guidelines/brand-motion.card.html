<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;background:var(--void-1);font:var(--type-body)}.g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}.col{display:grid;gap:6px}</style></head><body><style>@keyframes fl{from{width:6%}to{width:94%}}@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}</style><div class="col" style="gap:12px">
<div class="col" style="gap:4px"><em class="lb">capture progress · linear · 8s</em><div style="height:3px;background:rgba(255,255,255,.07)"><i style="display:block;height:3px;background:var(--sig-friendly);animation:fl 8s var(--ease-linear) infinite"></i></div></div>
<div class="col" style="gap:4px"><em class="lb">commit pulse · 1400ms · the only loop in the system</em><span style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--cyan-300);animation:pl var(--pulse-commit) var(--ease-inout) infinite">warp committed</span></div>
<div class="g" style="gap:18px"><div class="col" style="gap:2px"><em class="lb" style="font-style:normal;font-family:var(--font-mono);color:var(--text-1)">80ms</em><em class="lb" style="font-style:normal">instant · hover / press</em></div><div class="col" style="gap:2px"><em class="lb" style="font-style:normal;font-family:var(--font-mono);color:var(--text-1)">140ms</em><em class="lb" style="font-style:normal">fast · panel state</em></div><div class="col" style="gap:2px"><em class="lb" style="font-style:normal;font-family:var(--font-mono);color:var(--text-1)">220ms</em><em class="lb" style="font-style:normal">base · selection</em></div><div class="col" style="gap:2px"><em class="lb" style="font-style:normal;font-family:var(--font-mono);color:var(--text-1)">600ms</em><em class="lb" style="font-style:normal">slow · ring tick</em></div></div></div></body></html>
