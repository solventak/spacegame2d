<!-- @dsCard group="Colors" viewport="700x190" name="Allegiance Semantics" subtitle="Only three allegiances exist; nothing else may be coloured" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:14px;background:var(--void-1);font:var(--type-body)}.g{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.lb{font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-3)}.col{display:grid;gap:6px}</style></head><body><div class="col" style="gap:10px">
<div class="g"><div class="g" style="gap:8px;padding:8px 10px;border:1px solid var(--sig-friendly-edge);background:var(--sig-friendly-wash);min-width:200px"><i style="width:10px;height:10px;border-radius:99px;background:var(--sig-friendly)"></i><em class="lb" style="font-style:normal;color:var(--sig-friendly)">friendly</em><em class="lb" style="font-style:normal;margin-left:auto;font-family:var(--font-mono)">--sig-friendly</em></div><div class="g" style="gap:8px;padding:8px 10px;border:1px solid var(--sig-enemy-edge);background:var(--sig-enemy-wash);min-width:200px"><i style="width:10px;height:10px;border-radius:99px;background:var(--sig-enemy)"></i><em class="lb" style="font-style:normal;color:var(--sig-enemy)">enemy</em><em class="lb" style="font-style:normal;margin-left:auto;font-family:var(--font-mono)">--sig-enemy</em></div><div class="g" style="gap:8px;padding:8px 10px;border:1px solid var(--sig-neutral-edge);background:var(--sig-neutral-wash);min-width:200px"><i style="width:10px;height:10px;border-radius:99px;background:var(--sig-neutral)"></i><em class="lb" style="font-style:normal;color:var(--sig-neutral)">neutral</em><em class="lb" style="font-style:normal;margin-left:auto;font-family:var(--font-mono)">--sig-neutral</em></div></div>
<div class="g" style="gap:8px"><div class="col" style="gap:5px"><i style="display:block;width:150px;height:22px;background:var(--sig-friendly)"></i><em class="lb" style="font-style:normal">solid</em><em class="lb" style="font-style:normal;color:var(--text-2)">confirmed ownership</em></div><div class="col" style="gap:5px"><i style="display:block;width:150px;height:22px;background:var(--stripe-contested-friendly)"></i><em class="lb" style="font-style:normal">striped</em><em class="lb" style="font-style:normal;color:var(--text-2)">contested, paused</em></div><div class="col" style="gap:5px"><i style="display:block;width:150px;height:22px;background:var(--stripe-decay)"></i><em class="lb" style="font-style:normal">gray striped</em><em class="lb" style="font-style:normal;color:var(--text-2)">decaying</em></div><div class="col" style="gap:5px"><i style="display:block;width:150px;height:22px;border:1px dashed var(--sig-neutral-edge)"></i><em class="lb" style="font-style:normal">dashed</em><em class="lb" style="font-style:normal;color:var(--text-2)">uncertain / planned</em></div></div></div></body></html>
