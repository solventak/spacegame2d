name: Release from dev

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-from-dev
  cancel-in-progress: false

jobs:
  open-release-pr:
    name: Open dev to main release PR
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev" || {
            echo "Run this workflow with dev selected as the branch." >&2
            exit 1
          }

      - name: Find or create the release PR
        id: release-pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head dev \
            --state open \
            --json number,url \
            --jq '.[0] // empty')"

          if [ -n "$existing_pr" ]; then
            number="$(jq -r '.number' <<< "$existing_pr")"
            url="$(jq -r '.url' <<< "$existing_pr")"
            echo "number=$number" >> "$GITHUB_OUTPUT"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Release PR already exists: $url"
            exit 0
          fi

          body_file="$RUNNER_TEMP/release-pr.md"
          cat > "$body_file" <<'EOF'
          ## Release

          This PR promotes the current `dev` branch to `main`.

          ### Acceptance Criteria

          - [ ] The cumulative changes from `dev` are approved for release.
          - [ ] Required CI checks pass.
          - [ ] This PR is merged into `main`.

          ### Summary of files touched

          This promotion PR contains the cumulative changes merged into `dev` since the last release.

          ### Test Output

          Required CI checks run against this PR. See the Checks tab for their output.
          EOF

          created_pr="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head dev \
            --title "Release: promote dev to main" \
            --body-file "$body_file")"
          number="$(gh pr view "$created_pr" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$created_pr" >> "$GITHUB_OUTPUT"
          echo "Created release PR: $created_pr"

      - name: Publish release PR summary
        env:
          RELEASE_PR_URL: ${{ steps.release-pr.outputs.url }}
        run: |
          {
            echo "## Release PR"
            echo
            echo "Review and merge: $RELEASE_PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
