name: Coverage

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain (1.91)
        uses: dtolnay/rust-toolchain@1.91

      - name: Install Node.js (22)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/spacegame2d/hud/package-lock.json

      - name: Install HUD dependencies
        working-directory: crates/spacegame2d/hud
        run: npm ci

      - name: Install system dependencies for wgpu, Winit, and Wry
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.37.0

      - name: Run coverage gate (fail-under 85%)
        run: |
          cargo tarpaulin \
            --workspace \
            --exclude-files "*/main.rs" \
            --fail-under 85 \
            --out xml --out html \
            --output-dir coverage/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
