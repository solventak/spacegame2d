name: Terraform Plan

on:
  pull_request_target:
    branches: [dev, main]
    paths:
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/release-client.yml"
      - ".terraform-version"
      - "infra/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        run: echo "value=$(tr -d '\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.value }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate production infrastructure without credentials
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Validate identity bootstrap without credentials
        run: |
          terraform -chdir=infra/bootstrap/identity init -backend=false -input=false
          terraform -chdir=infra/bootstrap/identity validate

      - name: Run production Terraform plan tests
        run: terraform -chdir=infra test

      - name: Run identity bootstrap Terraform plan tests
        run: terraform -chdir=infra/bootstrap/identity test

  plan:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    env:
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Check out the trusted same-repository pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Read Terraform version
        id: terraform-version
        run: echo "value=$(tr -d '\n' < .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.value }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_TERRAFORM_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify the short-lived plan identity
        run: |
          test "$(gcloud config get-value account)" = "${{ vars.GCP_TERRAFORM_PLAN_SERVICE_ACCOUNT }}"
          gcloud auth print-access-token >/dev/null

      - name: Create speculative cloud-aware plans
        shell: bash
        run: |
          set -euo pipefail

          plan_root() {
            local name="$1"
            local directory="$2"
            shift 2
            local output="$RUNNER_TEMP/${name}.plan.txt"

            terraform -chdir="$directory" init -input=false

            set +e
            terraform -chdir="$directory" plan \
              -detailed-exitcode \
              -input=false \
              -lock=false \
              -no-color \
              "$@" > "$output" 2>&1
            local status=$?
            set -e

            {
              echo "## ${name} Terraform plan"
              echo
              if [ "$status" -eq 0 ]; then
                echo "No changes."
              elif [ "$status" -eq 2 ]; then
                echo "Changes detected."
              else
                echo "Plan failed (exit $status)."
              fi
              echo
              echo '```text'
              cat "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
              cat "$output" >&2
              return "$status"
            fi
          }

          plan_root production infra
          plan_root identity-bootstrap infra/bootstrap/identity \
            -var-file=terraform.tfvars.example
