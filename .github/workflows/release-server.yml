name: Release Server

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: server-release-production
  cancel-in-progress: false

env:
  IMAGE_PATH: us-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/spacegame2d-server/spacegame2d-server
  LOCAL_IMAGE: local/spacegame2d-server:${{ github.sha }}
  BUILDKIT_CACHE_SCOPE: spacegame2d-server

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.91)
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy

      - name: Install system dependencies for the workspace test gate
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwebkit2gtk-4.1-dev pkg-config

      - name: Run the repository Rust test gate
        run: cargo fmt --check && cargo clippy -- -D warnings && cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the linux/amd64 server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.BUILDKIT_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.BUILDKIT_CACHE_SCOPE }}

      - name: Smoke-test the release image
        shell: bash
        run: |
          set -euo pipefail
          test "${#GITHUB_SHA}" -eq 40

          container_name=spacegame2d-server-smoke
          log_file="$RUNNER_TEMP/server-image.log"
          cleanup() {
            docker logs "$container_name" > "$log_file" 2>&1 || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          runtime_user="$(docker image inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")"
          test -n "$runtime_user"
          test "$runtime_user" != "root"
          docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c \
            'test "$(id -u)" -ne 0 && ! command -v cargo && ! command -v rustc'

          docker run --detach --name "$container_name" \
            --env SPACEGAME_LOG_FORMAT=json \
            --publish 127.0.0.1::4000 \
            "$LOCAL_IMAGE" >/dev/null

          host_port="$(docker port "$container_name" 4000/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$host_port"

          for attempt in {1..20}; do
            if timeout 1 bash -c ":</dev/tcp/127.0.0.1/$host_port"; then
              break
            fi
            sleep 1
          done
          timeout 1 bash -c ":</dev/tcp/127.0.0.1/$host_port"

          simulation_version="$(sed -n 's/^pub const SIMULATION_VERSION: u32 = \([0-9][0-9]*\);$/\1/p' crates/protocol/src/lib.rs)"
          test -n "$simulation_version"
          docker logs "$container_name" > "$log_file" 2>&1
          jq -e --arg git_sha "$GITHUB_SHA" --argjson simulation_version "$simulation_version" \
            'select(.fields.event == "server_starting" and .fields.git_sha == $git_sha and
              .fields.simulation_version == $simulation_version and .fields.address == "0.0.0.0:4000")' \
            "$log_file" >/dev/null

      - name: Save the tested image for publishing
        run: docker save --output "$RUNNER_TEMP/spacegame2d-server.tar" "$LOCAL_IMAGE"

      - name: Upload the tested image
        uses: actions/upload-artifact@v4
        with:
          name: spacegame2d-server-image-${{ github.sha }}
          path: ${{ runner.temp }}/spacegame2d-server.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: spacegame2d-server-image-${{ github.sha }}
          path: ${{ runner.temp }}/release-image

      - name: Load the tested image
        run: docker load --input "$RUNNER_TEMP/release-image/spacegame2d-server.tar"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_SERVER_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVER_RELEASE_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify the short-lived release identity
        run: |
          test "$(gcloud config get-value account)" = "${{ vars.GCP_SERVER_RELEASE_SERVICE_ACCOUNT }}"
          gcloud auth print-access-token >/dev/null

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Push the tested immutable image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_PATH:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$image_ref"
          push_output="$(docker push "$image_ref")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '{ for (field = 1; field <= NF; field++) if ($field == "digest:") { print $(field + 1); exit } }')"
          test -n "$digest"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Summarize immutable image publication
        run: |
          {
            echo "## Server image release"
            echo
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Image: \`${{ steps.push.outputs.image_ref }}@${{ steps.push.outputs.digest }}\`"
            echo "- Build cache: \`type=gha,scope=$BUILDKIT_CACHE_SCOPE,mode=max\`"
            echo "- Deployment: not performed by SWA-63; SWA-66 owns the VM release step."
          } >> "$GITHUB_STEP_SUMMARY"
