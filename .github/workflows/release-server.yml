name: Release Server

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: server-release-production
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_SERVER_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVER_RELEASE_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify the short-lived release identity
        run: |
          test "$(gcloud config get-value account)" = "${{ vars.GCP_SERVER_RELEASE_SERVICE_ACCOUNT }}"
          gcloud auth print-access-token >/dev/null
